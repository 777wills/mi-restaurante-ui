name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Toma la versión de pnpm del campo packageManager de package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (incluye accesibilidad de plantillas)
        run: pnpm lint

      - name: Pruebas con cobertura (umbral 80 % en angular.json)
        run: |
          echo '## Cobertura (frontend)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm ng test --coverage --no-watch --coverage-reporters text-summary --coverage-reporters html | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build de producción
        run: pnpm build

      - name: Auditoría de dependencias
        run: pnpm audit

      - name: Publicar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-frontend
          path: coverage/
          if-no-files-found: ignore
